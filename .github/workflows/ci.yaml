name: CI
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: corepack enable
      # actions/setup-node v6.2.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version-file: package.json
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm fetch
  check:
    runs-on: ubuntu-latest
    needs: install
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: corepack enable
      # actions/setup-node v6.2.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version-file: package.json
          cache: "pnpm"
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: "packages/md-extractor/.python-version"
      # astral-sh/setup-uv v6.8.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          version-file: "packages/md-extractor/pyproject.toml"
      - name: Install dependencies (offline)
        run: pnpm install --offline --frozen-lockfile
      - name: Sync md-extractor dependencies
        run: uv sync --project packages/md-extractor --frozen
      - name: db package build
        run: pnpm db build
      - name: Run typescript check
        run: pnpm check # biome check
      - name: Run python check
        run: pnpm md check
      - name: Run typecheck
        run: pnpm --recursive run typecheck
  build:
    runs-on: ubuntu-latest
    needs: install
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: corepack enable
      # actions/setup-node v6.2.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version-file: package.json
          cache: "pnpm"
      - name: Install dependencies (offline)
        run: pnpm install --offline --frozen-lockfile
      # ビルドに必要なダミーの環境変数を作成
      - name: Create dummy env files
        run: |
          for f in packages/*/.env.example; do
            cp "$f" "${f%.example}"
          done
      - name: Build packages
        run: pnpm --recursive run build
