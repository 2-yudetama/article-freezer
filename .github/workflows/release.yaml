# https://docs.github.com/en/packages/managing-github-packages-using-github-actions-workflows/publishing-and-installing-a-package-with-github-actions
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate SemVer tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Tag must be a valid SemVer tag prefixed with v: $GITHUB_REF_NAME"
            exit 1
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: web-app
            context: .
            file: Dockerfile
          - name: md-extractor
            context: packages/md-extractor
            file: packages/md-extractor/Dockerfile
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # docker/login-action v3.6.0
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker/metadata-action v5.8.0
      - id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image.name }}
          tags: |
            type=ref,event=tag
      # docker/build-push-action v6.18.0
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        service:
          - web-app
          - md-extractor
    env:
      NORTHFLANK_PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
      NORTHFLANK_REGISTRY_CREDENTIAL_ID: ${{ vars.NORTHFLANK_REGISTRY_CREDENTIAL_ID }}
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Deploy ${{ matrix.service }} to Northflank
        env:
          IMAGE_PATH: >-
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{
            github.ref_name }}
          NORTHFLANK_SERVICE_ID: ${{ matrix.service }}
        run: |
          jq -n \
            --arg imagePath "$IMAGE_PATH" \
            --arg credentials "$NORTHFLANK_REGISTRY_CREDENTIAL_ID" \
            '{
              external: {
                imagePath: $imagePath,
                credentials: $credentials
              },
              docker: {
                configType: "default"
              }
            }' > payload.json

          curl --fail-with-body \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $NORTHFLANK_API_TOKEN" \
            --request POST \
            --data @payload.json \
            "https://api.northflank.com/v1/projects/${NORTHFLANK_PROJECT_ID}/services/${NORTHFLANK_SERVICE_ID}/deployment"

  release:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
