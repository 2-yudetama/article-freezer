# https://docs.github.com/en/packages/managing-github-packages-using-github-actions-workflows/publishing-and-installing-a-package-with-github-actions
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate SemVer tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Tag must be a valid SemVer tag prefixed with v: $GITHUB_REF_NAME"
            exit 1
          fi

  build-web-app:
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      image-name: web-app
      context: .
      dockerfile: Dockerfile

  build-md-extractor:
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      image-name: md-extractor
      context: packages/md-extractor
      dockerfile: packages/md-extractor/Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: [build-web-app, build-md-extractor]
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web-app
            digest: ${{ needs.build-web-app.outputs.digest }}
          - service: md-extractor
            digest: ${{ needs.build-md-extractor.outputs.digest }}
    env:
      NORTHFLANK_PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
      NORTHFLANK_REGISTRY_CREDENTIAL_ID: ${{ vars.NORTHFLANK_REGISTRY_CREDENTIAL_ID }}
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Deploy ${{ matrix.service }} to Northflank
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          IMAGE_DIGEST: ${{ matrix.digest }}
          NORTHFLANK_SERVICE_ID: ${{ matrix.service }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid deployment image digest"
            exit 1
          fi

          image_path="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          jq -n \
            --arg imagePath "$image_path" \
            --arg credentials "$NORTHFLANK_REGISTRY_CREDENTIAL_ID" \
            '{
              external: {
                imagePath: $imagePath,
                credentials: $credentials
              },
              docker: {
                configType: "default"
              }
            }' > payload.json

          curl --fail-with-body \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $NORTHFLANK_API_TOKEN" \
            --request POST \
            --data @payload.json \
            "https://api.northflank.com/v1/projects/${NORTHFLANK_PROJECT_ID}/services/${NORTHFLANK_SERVICE_ID}/deployment"

  release:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
