name: DB Migration

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate SemVer tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Tag must be a valid SemVer tag prefixed with v: $GITHUB_REF_NAME"
            exit 1
          fi

  detect-migrations:
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      has_migration_changes: ${{ steps.diff.outputs.has_migration_changes }}
      previous_tag: ${{ steps.diff.outputs.previous_tag }}
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Detect migration changes since previous tag
        id: diff
        run: |
          previous_tag="$(git tag --sort=-version:refname --merged "$GITHUB_SHA" 'v*.*.*' | grep -Fxv "$GITHUB_REF_NAME" | head -n 1)"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

          if [[ -n "$previous_tag" ]]; then
            changed_files="$(git diff --name-only "$previous_tag" "$GITHUB_SHA" -- packages/db/prisma/migrations)"
          else
            changed_files="$(git ls-tree -r --name-only "$GITHUB_SHA" -- packages/db/prisma/migrations)"
          fi

          if [[ -n "$changed_files" ]]; then
            echo "has_migration_changes=true" >> "$GITHUB_OUTPUT"
            echo "Detected migration changes"
            printf '%s\n' "$changed_files"
          else
            echo "has_migration_changes=false" >> "$GITHUB_OUTPUT"
            echo "No migration changes detected"
          fi

  run-migration:
    runs-on: ubuntu-latest
    needs: detect-migrations
    if: needs.detect-migrations.outputs.has_migration_changes == 'true'
    environment: prod
    env:
      NORTHFLANK_PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
      NORTHFLANK_JOB_ID: ${{ vars.NORTHFLANK_DB_MIGRATION_JOB_ID }}
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Start DB migration job build on Northflank
        id: build
        run: |
          response="$(
            curl --silent --show-error --fail-with-body \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer $NORTHFLANK_API_TOKEN" \
              --request POST \
              --data '{}' \
              "https://api.northflank.com/v1/projects/${NORTHFLANK_PROJECT_ID}/jobs/${NORTHFLANK_JOB_ID}/build"
          )"

          build_id="$(jq -r '.data.id' <<< "$response")"

          if [[ -z "$build_id" || "$build_id" == "null" ]]; then
            echo "Failed to read Northflank build id"
            exit 1
          fi

          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Wait for DB migration job build
        id: wait-build
        run: |
          build_id="${{ steps.build.outputs.build_id }}"

          for _ in {1..60}; do
            response="$(
              curl --silent --show-error --fail-with-body \
                --header "Content-Type: application/json" \
                --header "Authorization: Bearer $NORTHFLANK_API_TOKEN" \
                "https://api.northflank.com/v1/projects/${NORTHFLANK_PROJECT_ID}/jobs/${NORTHFLANK_JOB_ID}/build/${build_id}"
            )"

            status="$(jq -r '.data.status' <<< "$response")"
            concluded="$(jq -r '.data.concluded' <<< "$response")"
            success="$(jq -r '.data.success' <<< "$response")"

            echo "Northflank build status: $status"

            if [[ "$concluded" == "true" ]]; then
              if [[ "$success" == "true" ]]; then
                branch="$(jq -r 'if (.data.branch | type) == "string" then .data.branch else empty end' <<< "$response")"

                if [[ -z "$branch" ]]; then
                  echo "Failed to read Northflank build branch"
                  exit 1
                fi

                echo "branch=$branch" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              echo "Northflank build failed with status: $status"
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for Northflank build to complete"
          exit 1

      - name: Run DB migration job on Northflank
        env:
          NF_BRANCH: ${{ steps.wait-build.outputs.branch }}
        run: |
          build_id="${{ steps.build.outputs.build_id }}"
          payload="$(
            jq -n \
              --arg job_id "$NORTHFLANK_JOB_ID" \
              --arg build_id "$build_id" \
              --arg branch "$NF_BRANCH" \
              '{
                deployment: {
                  docker: {
                    configType: "default"
                  },
                  internal: {
                    id: $job_id,
                    buildId: $build_id,
                    branch: $branch
                  }
                }
              }'
          )"

          echo "Running Northflank migration build: $build_id"

          curl --silent --show-error --fail-with-body \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $NORTHFLANK_API_TOKEN" \
            --request POST \
            --data "$payload" \
            "https://api.northflank.com/v1/projects/${NORTHFLANK_PROJECT_ID}/jobs/${NORTHFLANK_JOB_ID}/runs"
