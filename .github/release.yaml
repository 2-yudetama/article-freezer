# https://docs.github.com/ja/repositories/releasing-projects-on-github/automatically-generated-release-notes#example-configurations

changelog:
  exclude:
    labels:
      - design
      - environment
      - survey
  categories:
    - title: ✨ Features
      labels:
        - feature
    - title: ⚡️ Enhancements
      labels:
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 📝 Documentation
      labels:
        - documentation
    - title: ♻️ Refactoring
      labels:
        - refactoring
    - title: Other Changes
      labels:
        - "*"
